<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Wonder Pads Studio</title>
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#F1CFEA" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="application-name" content="Wonder Pads Studio" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Wonder Pads Studio" />
<link rel="apple-touch-icon" href="assets/icon-512.png" />
<link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png" />
<link rel="icon" type="image/png" sizes="512x512" href="assets/icon-512.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Nunito+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blush:#F1CFEA;
    --blush-soft:#F9E4F3;
    --blush-deep:#E4A6D6;
    --rose:#C97AB8;
    --sage:#A8B79E;
    --sage-deep:#7C8F73;
    --sage-grey:#B8BEB1;
    --linen:#FFFCFE;
    --linen-warm:#FAF1F7;
    --cream:#FFFDFE;
    --ink:#3D2F3A;
    --ink-soft:#6B5C68;
    --muted:#9A8E96;
    --line:#E9DFE4;
    --card:#FFFFFF;
    --shadow-sm: 0 1px 2px rgba(120,80,110,.06), 0 2px 8px rgba(120,80,110,.04);
    --shadow-md: 0 4px 14px rgba(120,80,110,.08), 0 10px 30px rgba(120,80,110,.06);
    --shadow-lg: 0 12px 40px rgba(120,80,110,.12);
    --serif: 'Cormorant Garamond', 'Georgia', serif;
    --sans: 'Nunito Sans', -apple-system, system-ui, sans-serif;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:#FFFCFE; color:var(--ink); font-family:var(--sans); font-size:14px; -webkit-font-smoothing:antialiased; }
  a{ color:inherit; text-decoration:none; }
  button{ font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }
  input, textarea, select{ font-family:inherit; color:inherit; }
  #root{ min-height:100vh; }
  .serif{ font-family:var(--serif); font-weight:500; letter-spacing:.01em; }
  ::selection{ background:var(--blush); color:var(--ink); }

  /* white studio canvas with a restrained blush wash */
  .app-bg{
    background:
      radial-gradient(1100px 520px at 100% -8%, rgba(241,207,234,.18), transparent 62%),
      radial-gradient(900px 500px at 0% 35%, rgba(249,228,243,.12), transparent 64%),
      linear-gradient(180deg, #FFFFFF 0%, #FFFCFE 58%, #FFF9FC 100%);
  }

  /* sidebar */
  .sidebar{ position:fixed; top:0; left:0; bottom:0; width:236px; background:linear-gradient(180deg,#FFFFFF 0%,#FFF9FC 100%); border-right:1px solid rgba(228,166,214,.22); padding:24px 18px; z-index:20; display:flex; flex-direction:column; }
  .logo-mark{ width:44px; height:44px; border-radius:50%; background:radial-gradient(circle at 30% 30%, #fff, var(--blush-soft) 60%, var(--blush) 100%); display:flex; align-items:center; justify-content:center; box-shadow:inset 0 0 0 1px rgba(196,122,184,.25), 0 4px 12px rgba(196,122,184,.15);}
  .logo-mark svg{ width:26px; height:26px;}
  .brand-name{ font-family:var(--serif); font-size:19px; letter-spacing:.02em; line-height:1.1; color:var(--ink); }
  .brand-sub{ font-size:10.5px; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); margin-top:2px; }
  .nav-group-title{ font-size:10.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); padding:0 10px; margin:22px 0 6px; }
  .nav-item{ display:flex; align-items:center; gap:11px; padding:9px 12px; border-radius:10px; color:var(--ink-soft); font-weight:500; font-size:13.5px; cursor:pointer; transition:.15s; }
  .nav-item:hover{ background:var(--blush-soft); color:var(--ink); }
  .nav-item.active{ background:linear-gradient(90deg, var(--blush) 0%, var(--blush-soft) 100%); color:var(--ink); font-weight:600; box-shadow: inset 0 0 0 1px rgba(196,122,184,.18); }
  .nav-item svg{ width:16px; height:16px; opacity:.8; }
  .nav-item.active svg{ opacity:1; }
  .side-footer{ margin-top:auto; padding:14px; border-radius:14px; background:linear-gradient(160deg, #EED7E8 0%, #D3B8CD 100%); color:#5B2F52; font-size:12px; line-height:1.45; border:1px solid rgba(196,122,184,.2);}
  .side-footer .t{ font-family:var(--serif); font-size:15.5px; margin-bottom:2px; }

  /* main */
  .main{ margin-left:236px; min-height:100vh; }
  .topbar{ display:flex; align-items:center; justify-content:space-between; padding:18px 40px; border-bottom:1px solid rgba(228,166,214,.18); background:rgba(255,255,255,.9); backdrop-filter: blur(12px); position:sticky; top:0; z-index:15;}
  .crumbs{ display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--muted); }
  .crumbs .sep{ opacity:.5;}
  .crumbs .now{ color:var(--ink); font-weight:600; }
  .top-actions{ display:flex; align-items:center; gap:10px; }
  .search{ display:flex; align-items:center; gap:8px; background:#fff; border:1px solid var(--line); padding:8px 12px; border-radius:999px; width:280px; }
  .search input{ border:none; outline:none; background:none; width:100%; font-size:13px; }
  .icon-btn{ width:36px; height:36px; border-radius:50%; background:#fff; border:1px solid var(--line); display:flex; align-items:center; justify-content:center; position:relative; }
  .avatar{ width:36px; height:36px; border-radius:50%; background:linear-gradient(135deg, var(--blush) 0%, var(--rose) 100%); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; letter-spacing:.02em;}

  /* buttons */
  .btn{ display:inline-flex; align-items:center; gap:8px; padding:10px 16px; border-radius:999px; font-weight:600; font-size:13px; transition:.15s; white-space:nowrap; }
  .btn-primary{ background:linear-gradient(180deg,#3D2F3A 0%, #2A1F27 100%); color:#fff; box-shadow: 0 4px 12px rgba(61,47,58,.25); }
  .btn-primary:hover{ transform:translateY(-1px); box-shadow:0 6px 18px rgba(61,47,58,.3); }
  .btn-blush{ background:linear-gradient(180deg, #F5D8EF 0%, #E9BCE0 100%); color:#5B2F52; box-shadow: 0 2px 8px rgba(196,122,184,.18); border:1px solid rgba(196,122,184,.28);}
  .btn-blush:hover{ filter:brightness(1.02); box-shadow:0 4px 14px rgba(196,122,184,.28); }
  .btn-ghost{ background:#fff; border:1px solid var(--line); color:var(--ink); }
  .btn-ghost:hover{ border-color:var(--blush-deep); background:#FFFAFD; }
  .btn-sage{ background:linear-gradient(180deg,#B3C3A8 0%, #93A688 100%); color:#fff; box-shadow: 0 2px 8px rgba(124,143,115,.25);}

  /* pill */
  .pill{ display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:999px; font-size:11px; font-weight:600; letter-spacing:.02em; }
  .pill-blush{ background:var(--blush-soft); color:#8A3D7A; }
  .pill-sage{ background:#EAEFE5; color:var(--sage-deep); }
  .pill-linen{ background:var(--linen-warm); color:#7A6752; }
  .pill-live{ background:#EAF7EE; color:#3E8556; }
  .pill-draft{ background:#F5EDE0; color:#8A7345; }
  .pill-dot{ width:6px; height:6px; border-radius:50%; background:currentColor; }

  /* page */
  .page{ padding:28px 40px 60px; max-width:1400px; }
  .page-head{ display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:22px; gap:24px; }
  .page-title{ font-family:var(--serif); font-size:34px; line-height:1.05; color:var(--ink); letter-spacing:.005em; }
  .page-sub{ color:var(--ink-soft); margin-top:6px; font-size:13.5px; max-width:640px; }

  /* card */
  .card{ background:var(--card); border:1px solid var(--line); border-radius:18px; box-shadow: var(--shadow-sm); }
  .card-pad{ padding:22px; }

  /* stats row */
  .stat-row{ display:grid; grid-template-columns: repeat(4, 1fr); gap:14px; margin-bottom:24px; }
  .stat{ padding:16px 18px; border-radius:16px; background:#fff; border:1px solid var(--line);}
  .stat .lbl{ font-size:11px; text-transform:uppercase; letter-spacing:.14em; color:var(--muted); }
  .stat .val{ font-family:var(--serif); font-size:28px; color:var(--ink); margin-top:4px; letter-spacing:.005em;}
  .stat .delta{ font-size:11.5px; color:var(--sage-deep); margin-top:2px; font-weight:600;}
  .stat .delta.warn{ color:#B27D42; }
  .stat.accent{ background:linear-gradient(140deg, #FDF3FA 0%, #F7E6F1 100%); border-color:rgba(196,122,184,.2);}

  /* preset grid */
  .preset-grid{ display:grid; grid-template-columns: repeat(3, 1fr); gap:18px; }
  .preset-card{ background:#fff; border:1px solid var(--line); border-radius:18px; overflow:hidden; transition:.18s; cursor:pointer; box-shadow:var(--shadow-sm); }
  .preset-card:hover{ transform:translateY(-2px); box-shadow: var(--shadow-md); border-color:rgba(196,122,184,.3);}
  .preset-card.selected{ box-shadow: 0 0 0 2px var(--blush-deep), var(--shadow-md); border-color:transparent;}
  .preset-thumb{ aspect-ratio: 4/3; background:var(--linen-warm); position:relative; overflow:hidden;}
  .preset-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .preset-thumb .overlay-tools{ position:absolute; top:10px; right:10px; display:flex; gap:6px; opacity:0; transition:.15s;}
  .preset-card:hover .overlay-tools{ opacity:1; }
  .overlay-btn{ width:30px; height:30px; border-radius:50%; background:rgba(255,255,255,.94); display:flex; align-items:center; justify-content:center; box-shadow:0 2px 6px rgba(0,0,0,.1);}
  .preset-thumb .badges{ position:absolute; top:10px; left:10px; display:flex; gap:6px; }
  .preset-body{ padding:14px 16px 16px; }
  .preset-name{ font-family:var(--serif); font-size:19px; color:var(--ink); letter-spacing:.005em; }
  .preset-meta{ display:flex; align-items:center; justify-content:space-between; margin-top:6px; }
  .preset-tags{ display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
  .tag{ font-size:10.5px; padding:3px 8px; border-radius:999px; background:var(--linen-warm); color:var(--ink-soft); font-weight:600; letter-spacing:.02em;}

  /* form */
  .field{ margin-bottom:16px; }
  .field-lbl{ display:flex; justify-content:space-between; align-items:center; font-size:11.5px; text-transform:uppercase; letter-spacing:.14em; color:var(--muted); font-weight:700; margin-bottom:7px;}
  .field-lbl .hint{ text-transform:none; letter-spacing:.02em; color:var(--muted); font-weight:500; font-size:11px;}
  .input, .textarea, .select{ width:100%; padding:10px 14px; background:#fff; border:1px solid var(--line); border-radius:10px; font-size:13.5px; outline:none; transition:.15s; }
  .input:focus, .textarea:focus, .select:focus{ border-color:var(--blush-deep); box-shadow: 0 0 0 3px rgba(228,166,214,.2);}
  .textarea{ min-height:110px; resize:vertical; line-height:1.5; }
  .prompt-locked{ background:linear-gradient(180deg, #FBF6F9 0%, #F7EFF4 100%); border:1px solid rgba(196,122,184,.25); border-radius:12px; padding:12px 14px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size:12px; color:var(--ink); line-height:1.55; position:relative;}
  .prompt-locked .lock{ position:absolute; top:10px; right:10px; display:inline-flex; align-items:center; gap:5px; font-size:10.5px; text-transform:uppercase; letter-spacing:.14em; color:var(--rose); font-weight:700; padding:3px 8px; border-radius:999px; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.05);}
  .neg-box{ background:#FAF6EF; border:1px dashed #DBCFA9; }
  .prompt-token{ background:rgba(196,122,184,.16); color:#8A3D7A; padding:1px 6px; border-radius:6px; margin:0 1px; font-weight:600;}

  /* seg control */
  .seg{ display:inline-flex; background:var(--linen-warm); padding:3px; border-radius:10px; gap:2px; }
  .seg button{ padding:7px 12px; border-radius:8px; font-size:12.5px; font-weight:600; color:var(--ink-soft); }
  .seg button.on{ background:#fff; color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.06);}

  /* slider */
  .slider-wrap{ display:flex; align-items:center; gap:12px; }
  input[type="range"]{ -webkit-appearance:none; appearance:none; flex:1; height:4px; background:linear-gradient(90deg, var(--blush-deep) 0 var(--pct,50%), var(--line) var(--pct,50%) 100%); border-radius:999px; outline:none; }
  input[type="range"]::-webkit-slider-thumb{ -webkit-appearance:none; width:18px; height:18px; border-radius:50%; background:#fff; border:2px solid var(--blush-deep); box-shadow:0 2px 4px rgba(0,0,0,.1); cursor:pointer;}
  .slider-val{ font-family:var(--serif); font-size:17px; min-width:36px; text-align:right; color:var(--ink);}

  /* toggle */
  .toggle{ position:relative; width:42px; height:24px; border-radius:999px; background:var(--line); cursor:pointer; transition:.2s; flex-shrink:0;}
  .toggle::after{ content:''; position:absolute; top:3px; left:3px; width:18px; height:18px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.15); transition:.2s;}
  .toggle.on{ background:linear-gradient(180deg, var(--blush-deep) 0%, var(--rose) 100%); }
  .toggle.on::after{ left:21px; }

  /* two column layout */
  .two-col{ display:grid; grid-template-columns: 1fr 380px; gap:24px; align-items:start;}
  .stack{ display:flex; flex-direction:column; gap:16px;}

  /* upload */
  .upload-zone{ border:1.5px dashed rgba(196,122,184,.4); background:linear-gradient(160deg, #FEFAFC 0%, #FBEEF6 100%); border-radius:16px; padding:22px; text-align:center; transition:.15s;}
  .upload-zone:hover{ background:linear-gradient(160deg, #FDF5FA 0%, #F7DFEE 100%); border-color:var(--blush-deep);}
  .uploaded-thumb{ position:relative; border-radius:14px; overflow:hidden; background:#fff; border:1px solid var(--line);}
  .uploaded-thumb img{ width:100%; display:block; }
  .gallery-actions{ display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:8px; }
  .gallery-action-btn{ min-width:0; justify-content:center; padding:6px 7px; font-size:11px; }
  .gallery-export-controls{ display:flex; align-items:center; flex-wrap:wrap; justify-content:flex-end; gap:6px; margin-left:10px; padding-left:10px; border-left:1px solid var(--line); }
  .gallery-export-label{ font-size:11px; text-transform:uppercase; letter-spacing:.12em; color:var(--muted); font-weight:700; }
  .gallery-export-chip{ padding:5px 9px; font-size:11px; }
  .gallery-export-btn{ padding:7px 12px; font-size:12px; }
  .stitching-line{ height:1px; background: repeating-linear-gradient(90deg, var(--sage-grey) 0 4px, transparent 4px 8px);  margin:14px 0; }

  /* preservation checklist */
  .pres-item{ display:flex; align-items:center; gap:10px; padding:9px 12px; background:#fff; border:1px solid var(--line); border-radius:10px; font-size:12.5px; color:var(--ink-soft);}
  .pres-item .check{ width:18px; height:18px; border-radius:50%; background:#EAEFE5; color:var(--sage-deep); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .pres-item .check svg{ width:11px; height:11px;}

  /* results */
  .results-grid{ display:grid; grid-template-columns: repeat(2, 1fr); gap:14px;}
  .result{ position:relative; border-radius:14px; overflow:hidden; background:#fff; border:1px solid var(--line); aspect-ratio: var(--tile-ratio, 1/1); box-shadow: var(--shadow-sm); transition:.18s;}
  .result:hover{ box-shadow: var(--shadow-md);}
  .result img{ width:100%; height:100%; object-fit:cover; display:block; }
  .result .num{ position:absolute; top:10px; left:10px; background:rgba(255,255,255,.94); border-radius:999px; padding:3px 10px; font-family:var(--serif); font-size:14px; color:var(--ink);}
  .result .toolbar{ position:absolute; bottom:10px; left:10px; right:10px; display:flex; gap:6px; opacity:0; transition:.18s;}
  .result:hover .toolbar{ opacity:1;}
  .result .toolbar .btn{ padding:6px 10px; font-size:11.5px; }
  .result.selected{ box-shadow: 0 0 0 2px var(--blush-deep), var(--shadow-md); border-color:transparent;}


  /* generation */
  .gen-panel{ padding:0; overflow:hidden;}
  .gen-header{ background:linear-gradient(160deg, #F9E4F3 0%, #F1CFEA 60%, #EABEE0 100%); padding:18px 22px; border-bottom:1px solid rgba(196,122,184,.2);}
  .gen-title{ font-family:var(--serif); font-size:22px; color:#4A2340; letter-spacing:.005em;}
  .gen-body{ padding:20px 22px; }
  .divider{ height:1px; background:var(--line); margin:16px 0;}

  /* radios / chips */
  .chips{ display:flex; flex-wrap:wrap; gap:6px; }
  .chip{ padding:6px 12px; border-radius:999px; background:#fff; border:1px solid var(--line); font-size:12px; font-weight:600; color:var(--ink-soft); cursor:pointer; transition:.12s;}
  .chip:hover{ border-color:var(--blush-deep);}
  .chip.on{ background:linear-gradient(180deg,#F7E6F1 0%,#F1CFEA 100%); border-color:rgba(196,122,184,.35); color:#5B2F52;}

  /* small icons via svg helper */
  .ico{ width:16px; height:16px; }
  .ico-sm{ width:13px; height:13px;}
  .ico-lg{ width:22px; height:22px;}
  .row{ display:flex; align-items:center; gap:10px; }
  .row.between{ justify-content:space-between; }

  /* tab switcher inside a card */
  .tabs{ display:flex; border-bottom:1px solid var(--line); }
  .tabs button{ padding:12px 18px; font-weight:600; font-size:13px; color:var(--muted); border-bottom:2px solid transparent; margin-bottom:-1px;}
  .tabs button.on{ color:var(--ink); border-color:var(--rose);}

  /* preservation card */
  .preserve-card{ background:linear-gradient(160deg, #F2F5EE 0%, #E6ECDD 100%); border:1px solid rgba(168,183,158,.35); border-radius:14px; padding:14px;}
  .preserve-title{ font-family:var(--serif); font-size:16px; color:var(--sage-deep); display:flex; align-items:center; gap:8px; margin-bottom:10px;}
  .studio-production-preset-tools{ align-items:flex-end; gap:8px; flex-wrap:wrap; }
  .studio-production-preset-picker{ display:flex; flex-direction:column; gap:4px; min-width:190px; }
  .studio-production-preset-picker > span{ color:var(--muted); font-size:10px; text-transform:uppercase; letter-spacing:.12em; }
  .studio-production-preset-picker .select{ min-width:190px; }
  .studio-presets-heading-actions{ flex:0 0 auto; }
  .studio-preset-section-switcher{ display:flex; gap:6px; margin-bottom:14px; padding:4px; border:1px solid rgba(196,122,184,.2); border-radius:12px; background:rgba(255,255,255,.72); }
  .studio-preset-section-switcher button{ display:inline-flex; align-items:center; justify-content:center; gap:6px; flex:1; min-height:38px; padding:7px 10px; border:1px solid transparent; border-radius:9px; background:transparent; color:var(--muted); font-size:11px; font-weight:700; cursor:pointer; }
  .studio-preset-section-switcher button.on{ background:linear-gradient(180deg,#F7E6F1 0%,#F1CFEA 100%); border-color:rgba(196,122,184,.3); color:#5B2F52; }
  .studio-preset-editor-card{ overflow:hidden; background:transparent; border:0; box-shadow:none; }
  .studio-preset-library-card{ background:transparent; border:0; box-shadow:none; }
  .studio-preset-tabs{ overflow-x:auto; flex-wrap:nowrap; }
  .studio-preset-tabs button{ white-space:nowrap; display:inline-flex; align-items:center; gap:6px; }
  .studio-preset-editor-body{ min-width:0; }
  .studio-preset-editor-head{ gap:12px; margin-bottom:18px; }
  .preset-editor-swatch{ width:48px; height:48px; flex:0 0 48px; border-radius:12px; border:1px solid var(--line); box-shadow:var(--shadow-sm); }
  .studio-preset-name-input{ display:block; width:min(100%,360px); min-width:0; padding:0; border:0; outline:0; background:transparent; color:var(--ink); font-family:var(--serif); font-size:22px; }
  .studio-preset-editor-actions{ flex:0 0 auto; }
  .studio-settings-form,.scene-prompt-notes,.guardrails-panel{ display:grid; gap:18px; }
  .studio-settings-section{ padding-top:14px; border-top:1px solid var(--line); }
  .studio-settings-grid{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px 16px; }
  .studio-settings-section > .studio-settings-grid{ margin-top:10px; }
  .studio-settings-note{ margin-top:8px; }
  .studio-backdrop-chips{ gap:7px; }
  .studio-preset-color-row{ margin-top:12px; gap:14px; }
  .studio-preset-color-row input{ width:30px; height:26px; padding:2px; border:1px solid var(--line); border-radius:7px; background:#fff; cursor:pointer; }
  .studio-checkbox{ gap:6px; align-self:end; min-height:36px; color:var(--ink-soft); font-size:12px; }
  .studio-preset-logo-row{ margin-top:10px; }
  .scene-prompt-callout{ display:flex; align-items:flex-start; gap:9px; padding:11px 12px; border:1px solid rgba(196,122,184,.22); border-radius:12px; background:#FFF3FA; color:var(--ink-soft); font-size:11.5px; line-height:1.5; }
  .scene-prompt-callout > .ico-sm{ flex:0 0 auto; color:var(--rose); margin-top:2px; }
  .scene-prompt-callout strong{ display:block; margin-bottom:2px; color:var(--ink); }
  .scene-prompt-preview{ max-height:160px; overflow:auto; }
  .guardrail-list{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
  .studio-preset-preview{ position:relative; min-height:245px; display:flex; align-items:center; justify-content:center; padding:24px; overflow:hidden; }
